<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Portal | Reliance Transit</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- EmailJS SDK -->
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
    <script type="text/javascript">
       (function(){
          emailjs.init({
            publicKey: "RZcgvK1w-8bfxOetA",
          });
       })();
    </script>

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
        body { background: #0b131f; color: #ffffff; }
        nav { display: flex; justify-content: space-between; align-items: center; padding: 20px 8%; background: #0b131f; border-bottom: 1px solid rgba(255,255,255,0.1); }
        .logo-area { display: flex; align-items: center; gap: 12px; }
        .logo-box { background: #0284c7; width: 40px; height: 40px; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 1.2rem; }
        .logo-text h1 { font-size: 1.1rem; font-weight: 700; }
        .logo-text p { font-size: 0.75rem; color: #94a3b8; letter-spacing: 1px; }
        .main-container { padding: 40px 8%; max-width: 1200px; margin: 0 auto; }
        .card { background: #1e293b; padding: 35px; border-radius: 16px; border: 1px solid rgba(255,255,255,0.05); margin-bottom: 40px; box-shadow: 0 10px 30px rgba(0,0,0,0.3); }
        .card h3 { font-size: 1.3rem; margin-bottom: 20px; color: #ffffff; }
        .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 20px; }
        .form-group { display: flex; flex-direction: column; gap: 8px; }
        .form-group label { font-size: 0.85rem; color: #94a3b8; font-weight: 500; }
        .form-group input, .form-group select { padding: 12px 15px; background: #0f172a; border: 1px solid rgba(255,255,255,0.1); border-radius: 8px; color: #ffffff; font-size: 0.95rem; outline: none; }
        .form-group input:focus, .form-group select:focus { border-color: #0284c7; }
        .btn-submit { background: #0284c7; color: white; border: none; padding: 14px; width: 100%; font-weight: 600; border-radius: 8px; cursor: pointer; transition: 0.3s; font-size: 1rem; }
        .btn-submit:hover { opacity: 0.9; }
        table { width: 100%; border-collapse: collapse; text-align: left; margin-top: 15px; }
        th { padding: 14px; color: #94a3b8; font-size: 0.85rem; border-bottom: 1px solid rgba(255,255,255,0.1); }
        td { padding: 14px; border-bottom: 1px solid rgba(255,255,255,0.05); font-size: 0.9rem; }
        .action-btn { background: #38bdf8; color: #0b131f; border: none; padding: 6px 12px; border-radius: 6px; font-weight: 600; cursor: pointer; }
        .delete-btn { background: #ef4444; color: white; border: none; padding: 6px 12px; border-radius: 6px; font-weight: 600; cursor: pointer; margin-left: 5px; }
    </style>
</head>
<body>

    <nav>
        <div class="logo-area">
            <div class="logo-box">RT</div>
            <div class="logo-text">
                <h1>RELIANCE TRANSIT</h1>
                <p>ADMIN CONTROL PANEL</p>
            </div>
        </div>
        <a href="index.html" style="color: #38bdf8; text-decoration: none; font-weight: 600; font-size: 0.9rem;">← View Live Site</a>
    </nav>

    <div class="main-container">
        <div class="card">
            <h3 id="form-title">Create New Shipment Waybill</h3>
            <form id="admin-form">
                <div class="form-grid">
                    <div class="form-group">
                        <label>Tracking Number</label>
                        <input type="text" id="track-no" required>
                    </div>
                    <div class="form-group">
                        <label>Client / Receiver Email (For Auto-Updates)</label>
                        <input type="email" id="client-email" placeholder="client@example.com" required>
                    </div>
                    <div class="form-group">
                        <label>Sender Name</label>
                        <input type="text" id="sender" placeholder="e.g. John Doe" required>
                    </div>
                    <div class="form-group">
                        <label>Receiver Name</label>
                        <input type="text" id="receiver" placeholder="e.g. Jane Smith" required>
                    </div>
                    <div class="form-group">
                        <label>Origin Hub</label>
                        <input type="text" id="origin" placeholder="e.g. New York Hub" required>
                    </div>
                    <div class="form-group">
                        <label>Destination Hub</label>
                        <input type="text" id="destination" placeholder="e.g. London Heathrow" required>
                    </div>
                    <div class="form-group">
                        <label>Package Status</label>
                        <select id="status" required>
                            <option value="Order Created / Label Generated">Order Created / Label Generated</option>
                            <option value="Package Received at Origin Facility">Package Received at Origin Facility</option>
                            <option value="In Air Transit">In Air Transit</option>
                            <option value="Customs Clearance Processing">Customs Clearance Processing</option>
                            <option value="Held at Customs">Held at Customs</option>
                            <option value="Arrived at Destination Hub">Arrived at Destination Hub</option>
                            <option value="Out for Delivery">Out for Delivery</option>
                            <option value="Delivery Attempted - Rescheduling">Delivery Attempted - Rescheduling</option>
                            <option value="Delivered">Delivered</option>
                            <option value="Return to Sender">Return to Sender</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Current Location Description</label>
                        <input type="text" id="curr-loc" placeholder="e.g. Main Hub - Central Sorting" required>
                    </div>
                    <div class="form-group">
                        <label>Estimated Delivery Date</label>
                        <input type="text" id="est-deliv" placeholder="e.g. 20 OCT 2026" required>
                    </div>
                </div>
                <button type="submit" class="btn-submit" id="submit-btn-text">Save & Register Waybill</button>
            </form>
        </div>

        <div class="card">
            <h3>Active Shipments Database</h3>
            <div style="overflow-x: auto;">
                <table>
                    <thead>
                        <tr>
                            <th>Tracking #</th>
                            <th>Receiver & Email</th>
                            <th>Status</th>
                            <th>Current Location</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="admin-table-body"></tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            document.getElementById('track-no').value = 'RT-' + Math.floor(100000 + Math.random() * 900000);
            loadTable();

            document.getElementById('admin-form').addEventListener('submit', function(e) {
                e.preventDefault();
                
                const trackingNumber = document.getElementById('track-no').value.trim();
                const client_email = document.getElementById('client-email').value.trim();
                const sender = document.getElementById('sender').value.trim();
                const receiver = document.getElementById('receiver').value.trim();
                const origin = document.getElementById('origin').value.trim();
                const destination = document.getElementById('destination').value.trim();
                const status = document.getElementById('status').value;
                const curr_loc = document.getElementById('curr-loc').value.trim();
                const est_deliv = document.getElementById('est-deliv').value.trim();

                const newShipment = { 
                    tracking_number: trackingNumber, 
                    client_email, 
                    sender, 
                    receiver, 
                    origin, 
                    destination, 
                    status, 
                    curr_loc, 
                    est_deliv 
                };

                let shipments = JSON.parse(localStorage.getItem('rt_shipments')) || [];
                const existingIndex = shipments.findIndex(s => s.tracking_number === trackingNumber);

                if (existingIndex !== -1) {
                    // Update existing shipment and fire EmailJS notification
                    shipments[existingIndex] = newShipment;
                    sendUpdateEmail(newShipment);
                } else {
                    // New entry
                    shipments.unshift(newShipment);
                    alert("Shipment registered successfully!");
                }

                localStorage.setItem('rt_shipments', JSON.stringify(shipments));
                
                this.reset();
                document.getElementById('track-no').value = 'RT-' + Math.floor(100000 + Math.random() * 900000);
                document.getElementById('form-title').innerText = "Create New Shipment Waybill";
                document.getElementById('submit-btn-text').innerText = "Save & Register Waybill";
                loadTable();
            });
        });

        function sendUpdateEmail(data) {
            const templateParams = {
                client_name: data.receiver,
                client_email: data.client_email,
                tracking_number: data.tracking_number,
                sender: data.sender,
                receiver: data.receiver,
                status: data.status,
                curr_loc: data.curr_loc,
                est_deliv: data.est_deliv
            };

            // Using your Email Service ID and Template ID (template_0uwd9qs)
            emailjs.send('default_service', 'template_0uwd9qs', templateParams)
                .then(function(response) {
                    console.log('SUCCESS! Email sent.', response.status, response.text);
                    alert('Package updated and professional status email notification sent to client!');
                }, function(error) {
                    console.log('FAILED...', error);
                    alert('Package updated locally, but email notification failed to send.');
                });
        }

        function loadTable() {
            const tbody = document.getElementById('admin-table-body');
            const shipments = JSON.parse(localStorage.getItem('rt_shipments')) || [];

            if (shipments.length === 0) {
                tbody.innerHTML = `<tr><td colspan="5" style="text-align: center; color: #94a3b8; padding: 20px;">No shipments registered yet.</td></tr>`;
                return;
            }

            tbody.innerHTML = '';
            shipments.forEach((s) => {
                tbody.innerHTML += `
                    <tr>
                        <td style="font-weight: 600; color: #38bdf8;">${s.tracking_number}</td>
                        <td>${s.receiver}<br><span style="font-size:0.75rem; color:#38bdf8;">${s.client_email || 'No email provided'}</span></td>
                        <td><span style="background: rgba(56, 189, 248, 0.1); color: #38bdf8; padding: 4px 8px; border-radius: 4px; font-size: 0.8rem;">${s.status}</span></td>
                        <td>${s.curr_loc}</td>
                        <td>
                            <button class="action-btn" type="button" onclick="editItem('${s.tracking_number}')">Edit</button>
                            <button class="delete-btn" type="button" onclick="deleteItem('${s.tracking_number}')">Delete</button>
                        </td>
                    </tr>
                `;
            });
        }

        function editItem(trackingNo) {
            const shipments = JSON.parse(localStorage.getItem('rt_shipments')) || [];
            const s = shipments.find(item => item.tracking_number === trackingNo);
            if (!s) return;

            document.getElementById('track-no').value = s.tracking_number;
            document.getElementById('client-email').value = s.client_email || '';
            document.getElementById('sender').value = s.sender;
            document.getElementById('receiver').value = s.receiver;
            document.getElementById('origin').value = s.origin;
            document.getElementById('destination').value = s.destination;
            document.getElementById('status').value = s.status;
            document.getElementById('curr-loc').value = s.curr_loc;
            document.getElementById('est-deliv').value = s.est_deliv;

            document.getElementById('form-title').innerText = "Update Existing Waybill (Will Email Client)";
            document.getElementById('submit-btn-text').innerText = "Save Changes & Email Client";

            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function deleteItem(trackingNo) {
            if (confirm("Are you sure you want to delete this shipment?")) {
                let shipments = JSON.parse(localStorage.getItem('rt_shipments')) || [];
                shipments = shipments.filter(s => s.tracking_number !== trackingNo);
                localStorage.setItem('rt_shipments', JSON.stringify(shipments));
                loadTable();
            }
        }
    </script>
</body>
</html>
