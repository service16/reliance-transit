<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Portal | Reliance Transit</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body style="background: #f8fafc; padding: 40px 0;">

    <div class="container" style="max-width: 1000px;">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px;">
            <h2 style="color: #0b1d3a;">Reliance Transit Admin Dashboard</h2>
            <a href="index.html" style="color: #0284c7; text-decoration: none; font-weight: 600;">← View Live Site</a>
        </div>

        <!-- Create Shipment Form Card -->
        <div style="background: white; padding: 35px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); margin-bottom: 40px;">
            <h3 style="color: #0b1d3a; margin-bottom: 20px;">Create New Shipment Waybill</h3>
            <form id="create-shipment-form" onsubmit="createNewShipment(event)">
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 15px;">
                    <input type="text" id="track-no" placeholder="Tracking Number (e.g. RT-1001)" required style="padding: 12px; border: 1px solid #cbd5e1; border-radius: 6px;">
                    <input type="text" id="sender" placeholder="Sender Name & City" required style="padding: 12px; border: 1px solid #cbd5e1; border-radius: 6px;">
                    <input type="text" id="receiver" placeholder="Receiver Name & City" required style="padding: 12px; border: 1px solid #cbd5e1; border-radius: 6px;">
                    <input type="text" id="origin" placeholder="Origin Hub (e.g. New York)" required style="padding: 12px; border: 1px solid #cbd5e1; border-radius: 6px;">
                    <input type="text" id="destination" placeholder="Destination Hub (e.g. London)" required style="padding: 12px; border: 1px solid #cbd5e1; border-radius: 6px;">
                    <select id="status" required style="padding: 12px; border: 1px solid #cbd5e1; border-radius: 6px; background: white;">
                        <option value="Order Created">Order Created</option>
                        <option value="In Air Transit">In Air Transit</option>
                        <option value="Out for Delivery">Out for Delivery</option>
                        <option value="Delivered">Delivered</option>
                    </select>
                    <input type="text" id="curr-loc" placeholder="Current Location Description" required style="padding: 12px; border: 1px solid #cbd5e1; border-radius: 6px;">
                    <input type="text" id="est-deliv" placeholder="Estimated Delivery Date" required style="padding: 12px; border: 1px solid #cbd5e1; border-radius: 6px;">
                </div>
                <button type="submit" style="width: 100%; padding: 14px; font-weight: 600; background: #0b1d3a; color: white; border: none; border-radius: 6px; cursor: pointer;">Save & Create Shipment</button>
            </form>
        </div>

        <!-- Shipments Database Table -->
        <div style="background: white; padding: 35px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05);">
            <h3 style="color: #0b1d3a; margin-bottom: 20px;">All Shipments Database</h3>
            <div style="overflow-x: auto;">
                <table style="width: 100%; border-collapse: collapse; text-align: left;">
                    <thead>
                        <tr style="border-bottom: 2px solid #e2e8f0; color: #64748b; font-size: 0.9rem;">
                            <th style="padding: 12px;">Tracking #</th>
                            <th style="padding: 12px;">Receiver</th>
                            <th style="padding: 12px;">Status</th>
                            <th style="padding: 12px;">Current Location</th>
                            <th style="padding: 12px;">Action</th>
                        </tr>
                    </thead>
                    <tbody id="shipments-table-body">
                        <!-- Data will inject here dynamically -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Supabase CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <!-- Initialize Supabase & Logic Inline -->
    <script>
        const SUPABASE_URL = 'https://cefgmttlrudmfcpgrdsi.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_GgKaaMJOUZjr8ELi2g7G2A_RyCKOL6f';
        window.supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        document.addEventListener('DOMContentLoaded', loadAdminShipments);

        async function createNewShipment(event) {
            event.preventDefault();

            const trackingNumber = document.getElementById('track-no').value.trim();
            const senderName = document.getElementById('sender').value.trim();
            const receiverName = document.getElementById('receiver').value.trim();
            const origin = document.getElementById('origin').value.trim();
            const destination = document.getElementById('destination').value.trim();
            const status = document.getElementById('status').value;
            const currentLocation = document.getElementById('curr-loc').value.trim();
            const estimatedDelivery = document.getElementById('est-deliv').value.trim();

            const { data, error } = await window.supabaseClient
                .from('shipments')
                .insert([{
                    tracking_number: trackingNumber,
                    sender_name: senderName,
                    receiver_name: receiverName,
                    origin: origin,
                    destination: destination,
                    status: status,
                    current_location: currentLocation,
                    estimated_delivery: estimatedDelivery
                }]);

            if (error) {
                alert("Failed to save: " + error.message);
                console.error("Supabase Error Details:", error);
            } else {
                alert("Shipment created successfully!");
                document.getElementById('create-shipment-form').reset();
                loadAdminShipments();
            }
        }

        async function loadAdminShipments() {
            const tableBody = document.getElementById('shipments-table-body');
            if (!tableBody) return;

            const { data, error } = await window.supabaseClient
                .from('shipments')
                .select('*')
                .order('tracking_number', { ascending: false });

            if (error) {
                console.error("Error loading shipments:", error.message);
                tableBody.innerHTML = `<tr><td colspan="5" style="padding: 20px; text-align: center; color: #dc2626;">Error loading data: ${error.message}</td></tr>`;
                return;
            }

            tableBody.innerHTML = '';
            
            if (!data || data.length === 0) {
                tableBody.innerHTML = `<tr><td colspan="5" style="padding: 20px; text-align: center; color: #64748b;">No shipments found in database. Create one above!</td></tr>`;
                return;
            }

            data.forEach(shipment => {
                tableBody.innerHTML += `
                    <tr style="border-bottom: 1px solid #f1f5f9;">
                        <td style="padding: 12px; font-weight: 600; color: #0b1d3a;">${shipment.tracking_number}</td>
                        <td style="padding: 12px;">${shipment.receiver_name}</td>
                        <td style="padding: 12px;"><span style="background: #e0f2fe; color: #0369a1; padding: 4px 8px; border-radius: 4px; font-size: 0.85rem; font-weight: 600;">${shipment.status}</span></td>
                        <td style="padding: 12px;">${shipment.current_location}</td>
                        <td style="padding: 12px;">
                            <button type="button" onclick="updateStatusPrompt('${shipment.tracking_number}')" style="background: #0284c7; color: white; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer;">Update</button>
                        </td>
                    </tr>
                `;
            });
        }

        async function updateStatusPrompt(trackingNumber) {
            const newStatus = prompt("Enter new status (e.g., In Air Transit, Out for Delivery, Delivered):");
            const newLocation = prompt("Enter current location description:");

            if (!newStatus || !newLocation) return;

            const { error } = await window.supabaseClient
                .from('shipments')
                .update({ status: newStatus, current_location: newLocation })
                .eq('tracking_number', trackingNumber);

            if (error) {
                alert("Update failed: " + error.message);
            } else {
                alert("Shipment status updated successfully!");
                loadAdminShipments();
            }
        }
    </script>
</body>
</html>
