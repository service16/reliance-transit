<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Portal | Reliance Transit</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
</head>
<body class="admin-body" style="background-color: #f1f5f9; padding-bottom: 50px;">

    <!-- Admin Header -->
    <header class="site-header">
        <div class="container nav-container">
            <div class="logo-wrapper">
                <span class="logo-text">RELIANCE <span>TRANSIT ADMIN</span></span>
            </div>
            <nav class="nav-links">
                <a href="index.html" target="_blank">View Live Site</a>
            </nav>
        </div>
    </header>

    <div class="container" style="margin-top: 40px;">
        
        <!-- Create Shipment Card -->
        <div style="background: #fff; padding: 30px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); margin-bottom: 40px;">
            <h2 style="color: #0b1d3a; margin-bottom: 20px;">Create New Shipment Waybill</h2>
            <form id="create-shipment-form" onsubmit="createNewShipment(event)" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 15px;">
                <input type="text" id="track-no" placeholder="Tracking Number (e.g. RT-1001)" required style="padding: 12px; border: 1px solid #cbd5e1; border-radius: 6px;">
                <input type="text" id="sender" placeholder="Sender Name & City" required style="padding: 12px; border: 1px solid #cbd5e1; border-radius: 6px;">
                <input type="text" id="receiver" placeholder="Receiver Name & City" required style="padding: 12px; border: 1px solid #cbd5e1; border-radius: 6px;">
                <input type="text" id="origin" placeholder="Origin Hub (e.g. New York)" required style="padding: 12px; border: 1px solid #cbd5e1; border-radius: 6px;">
                <input type="text" id="destination" placeholder="Destination Hub (e.g. London)" required style="padding: 12px; border: 1px solid #cbd5e1; border-radius: 6px;">
                <select id="status" style="padding: 12px; border: 1px solid #cbd5e1; border-radius: 6px;">
                    <option value="Order Created">Order Created</option>
                    <option value="Picked Up">Picked Up</option>
                    <option value="In Air Transit">In Air Transit</option>
                    <option value="Out for Delivery">Out for Delivery</option>
                    <option value="Delivered">Delivered</option>
                </select>
                <input type="text" id="curr-loc" placeholder="Current Location" required style="padding: 12px; border: 1px solid #cbd5e1; border-radius: 6px;">
                <input type="text" id="est-deliv" placeholder="Estimated Delivery Date" required style="padding: 12px; border: 1px solid #cbd5e1; border-radius: 6px;">
                <button type="submit" class="btn-track" style="grid-column: 1 / -1; padding: 14px; background: #0b1d3a; color: #fff; border: none; border-radius: 6px; font-weight: bold; cursor: pointer;">Save & Create Shipment</button>
            </form>
        </div>

        <!-- Manage Shipments Table -->
        <div style="background: #fff; padding: 30px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.05);">
            <h2 style="color: #0b1d3a; margin-bottom: 20px;">All Shipments Database</h2>
            <div style="overflow-x: auto;">
                <table style="width: 100%; border-collapse: collapse; text-align: left;">
                    <thead>
                        <tr style="border-bottom: 2px solid #e2e8f0; color: #64748b;">
                            <th style="padding: 12px;">Tracking #</th>
                            <th style="padding: 12px;">Receiver</th>
                            <th style="padding: 12px;">Status</th>
                            <th style="padding: 12px;">Current Location</th>
                            <th style="padding: 12px;">Action</th>
                        </tr>
                    </thead>
                    <tbody id="shipments-table-body">
                        <!-- Loaded dynamically via JS -->
                    </tbody>
                </table>
            </div>
        </div>

    </div>

    <!-- Supabase SDK & Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabaseClient.js"></script>
    <script src="admin.js"></script>
</body>
</html>
