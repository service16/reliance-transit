<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Portal | Reliance Transit</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- EmailJS SDK -->
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
    <script type="text/javascript">
       (function(){
          emailjs.init({
            publicKey: "RZcgvK1w-8bfxOetA",
          });
       })();
    </script>

    <!-- Firebase SDKs & Logic -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.1.0/firebase-app.js";
        import { getFirestore, collection, getDocs, doc, setDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/11.1.0/firebase-firestore.js";

        // Your Firebase Configuration
        const firebaseConfig = {
            apiKey: "AIzaSyBTBGEI8d_f8Ti4TI7hW9ASC4PEdf5la4A",
            authDomain: "reliance-transit.firebaseapp.com",
            projectId: "reliance-transit",
            storageBucket: "reliance-transit.firebasestorage.app",
            messagingSenderId: "1074202809376",
            appId: "1:1074202809376:web:19cfad7b2a4fb8a4245845",
            measurementId: "G-2Y0TD1DV59"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        let logoutTimer;

        function resetLogoutTimer() {
            clearTimeout(logoutTimer);
            logoutTimer = setTimeout(() => {
                sessionStorage.removeItem('isAdminLoggedIn');
                alert('Session expired due to 2 minutes of inactivity. Logging you out.');
                location.reload();
            }, 120000);
        }

        function setupActivityListeners() {
            ['mousemove', 'keydown', 'click', 'scroll', 'touchstart'].forEach(evt => {
                window.addEventListener(evt, resetLogoutTimer);
            });
            resetLogoutTimer();
        }

        window.handleLogin = function(e) {
            e.preventDefault();
            const passwordInput = document.getElementById('login-pass').value;

            if (passwordInput === 'Fridayboy1@') {
                sessionStorage.setItem('isAdminLoggedIn', 'true');
                document.getElementById('login-overlay').style.display = 'none';
                initPortal();
                setupActivityListeners();
            } else {
                alert('Incorrect password! Access denied.');
            }
        };

        document.addEventListener('DOMContentLoaded', () => {
            if (sessionStorage.getItem('isAdminLoggedIn') === 'true') {
                document.getElementById('login-overlay').style.display = 'none';
                initPortal();
                setupActivityListeners();
            } else {
                document.getElementById('login-overlay').style.display = 'flex';
            }
        });

        function initPortal() {
            document.getElementById('track-no').value = 'RT-' + Math.floor(100000 + Math.random() * 900000);
            loadTable();

            const adminForm = document.getElementById('admin-form');
            adminForm.onsubmit = async function(e) {
                e.preventDefault();
                
                const trackingNumber = document.getElementById('track-no').value.trim();
                const client_email = document.getElementById('client-email').value.trim();
                const sender = document.getElementById('sender').value.trim();
                const sender_country = document.getElementById('sender-country').value.trim();
                const receiver = document.getElementById('receiver').value.trim();
                const receiver_country = document.getElementById('receiver-country').value.trim();
                const house_address = document.getElementById('house-address').value.trim();
                const status = document.getElementById('status').value;
                const stage = document.getElementById('stage').value.trim();
                const current_city_country = document.getElementById('current-city-country').value.trim();
                const current_facility = document.getElementById('current-facility').value.trim();

                const newShipment = { 
                    tracking_number: trackingNumber, 
                    client_email: client_email, 
                    receiver_email: client_email, 
                    sender, 
                    sender_country,
                    receiver, 
                    receiver_country,
                    house_address,
                    status, 
                    stage,
                    current_city_country,
                    current_facility
                };

                try {
                    // Save document to Firestore cloud database using tracking number as ID
                    await setDoc(doc(db, "shipments", trackingNumber), newShipment);
                    sendUpdateEmail(newShipment);
                } catch (error) {
                    console.error("Firestore Error:", error);
                    alert("Failed to save to Firebase cloud. Check console for details.");
                }
            };
        }

        function sendUpdateEmail(data) {
            const templateParams = {
                client_name: data.receiver,
                client_email: data.client_email,
                tracking_number: data.tracking_number,
                sender: data.sender,
                sender_country: data.sender_country,
                receiver: data.receiver,
                receiver_country: data.receiver_country,
                house_address: data.house_address,
                status: data.status,
                stage: data.stage,
                current_city_country: data.current_city_country,
                current_facility: data.current_facility
            };

            emailjs.send('service_ms3se37', 'template_0uwd9qs', templateParams)
                .then(function(response) {
                    alert('Shipment saved to cloud and email notification sent!');
                    finalizeFormReset();
                }, function(error) {
                    console.error('EMAILJS ERROR DETAILS:', error);
                    alert('Saved to cloud database, but email sending failed.');
                    finalizeFormReset();
                });
        }

        function finalizeFormReset() {
            const form = document.getElementById('admin-form');
            form.reset();
            document.getElementById('track-no').value = 'RT-' + Math.floor(100000 + Math.random() * 900000);
            document.getElementById('form-title').innerText = "Create New Shipment Waybill";
            document.getElementById('submit-btn-text').innerText = "Save & Register Waybill";
            loadTable();
        }

        async function loadTable() {
            const tbody = document.getElementById('admin-table-body');
            tbody.innerHTML = `<tr><td colspan="5" style="text-align: center; color: #94a3b8; padding: 20px;">Loading from cloud...</td></tr>`;

            try {
                const querySnapshot = await getDocs(collection(db, "shipments"));
                if (querySnapshot.empty) {
                    tbody.innerHTML = `<tr><td colspan="5" style="text-align: center; color: #94a3b8; padding: 20px;">No shipments registered yet.</td></tr>`;
                    return;
                }

                tbody.innerHTML = '';
                querySnapshot.forEach((docSnap) => {
                    const s = docSnap.data();
                    const displayEmail = s.client_email || s.receiver_email || 'No email provided';
                    tbody.innerHTML += `
                        <tr>
                            <td style="font-weight: 600; color: #38bdf8;">${s.tracking_number}</td>
                            <td>${s.receiver}<br><span style="font-size:0.75rem; color:#38bdf8;">${displayEmail}</span></td>
                            <td><span style="background: rgba(56, 189, 248, 0.1); color: #38bdf8; padding: 4px 8px; border-radius: 4px; font-size: 0.8rem;">${s.status}</span></td>
                            <td>${s.current_city_country || 'N/A'}<br><span style="font-size:0.75rem; color:#94a3b8;">${s.current_facility || ''}</span></td>
                            <td>
                                <button class="action-btn" type="button" onclick="window.editItem('${s.tracking_number}')">Edit</button>
                                <button class="delete-btn" type="button" onclick="window.deleteItem('${s.tracking_number}')">Delete</button>
                            </td>
                        </tr>
                    `;
                });
            } catch (error) {
                console.error("Error loading table:", error);
                tbody.innerHTML = `<tr><td colspan="5" style="text-align: center; color: #ef4444; padding: 20px;">Error loading cloud data.</td></tr>`;
            }
        }

        window.editItem = async function(trackingNo) {
            const querySnapshot = await getDocs(collection(db, "shipments"));
            let s = null;
            querySnapshot.forEach(docSnap => {
                if(docSnap.data().tracking_number === trackingNo) s = docSnap.data();
            });
            if (!s) return;

            document.getElementById('track-no').value = s.tracking_number;
            document.getElementById('client-email').value = s.client_email || s.receiver_email || '';
            document.getElementById('sender').value = s.sender || '';
            document.getElementById('sender-country').value = s.sender_country || '';
            document.getElementById('receiver').value = s.receiver || '';
            document.getElementById('receiver-country').value = s.receiver_country || '';
            document.getElementById('house-address').value = s.house_address || '';
            document.getElementById('status').value = s.status || '';
            document.getElementById('stage').value = s.stage || '1';
            document.getElementById('current-city-country').value = s.current_city_country || '';
            document.getElementById('current-facility').value = s.current_facility || '';

            document.getElementById('form-title').innerText = "Update Existing Waybill (Will Email Client)";
            document.getElementById('submit-btn-text').innerText = "Save Changes & Email Client";

            window.scrollTo({ top: 0, behavior: 'smooth' });
        };

        window.deleteItem = async function(trackingNo) {
            if (confirm("Are you sure you want to delete this shipment from the cloud?")) {
                try {
                    await deleteDoc(doc(db, "shipments", trackingNo));
                    loadTable();
                } catch (error) {
                    console.error("Error deleting:", error);
                    alert("Failed to delete from cloud.");
                }
            }
        };
    </script>

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
        body { background: #0b131f; color: #ffffff; }
        #login-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #0b131f; z-index: 9999; display: flex;
            align-items: center; justify-content: center; padding: 20px;
        }
        .login-card {
            background: #1e293b; padding: 40px; border-radius: 16px;
            border: 1px solid rgba(255,255,255,0.05); width: 100%; max-width: 400px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5); text-align: center;
        }
        .login-card h2 { margin-bottom: 20px; color: #ffffff; font-size: 1.5rem; }
        nav { display: flex; justify-content: space-between; align-items: center; padding: 20px 8%; background: #0b131f; border-bottom: 1px solid rgba(255,255,255,0.1); }
        .logo-area { display: flex; align-items: center; gap: 12px; }
        .logo-box { background: #0284c7; width: 40px; height: 40px; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 1.2rem; }
        .logo-text h1 { font-size: 1.1rem; font-weight: 700; }
        .logo-text p { font-size: 0.75rem; color: #94a3b8; letter-spacing: 1px; }
        .main-container { padding: 40px 8%; max-width: 1200px; margin: 0 auto; }
        .card { background: #1e293b; padding: 35px; border-radius: 16px; border: 1px solid rgba(255,255,255,0.05); margin-bottom: 40px; box-shadow: 0 10px 30px rgba(0,0,0,0.3); }
        .card h3 { font-size: 1.3rem; margin-bottom: 20px; color: #ffffff; }
        .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 20px; }
        .form-group { display: flex; flex-direction: column; gap: 8px; }
        .form-group label { font-size: 0.85rem; color: #94a3b8; font-weight: 500; }
        .form-group input, .form-group select { padding: 12px 15px; background: #0f172a; border: 1px solid rgba(255,255,255,0.1); border-radius: 8px; color: #ffffff; font-size: 0.95rem; outline: none; }
        .form-group input:focus, .form-group select:focus { border-color: #0284c7; }
        .btn-submit { background: #0284c7; color: white; border: none; padding: 14px; width: 100%; font-weight: 600; border-radius: 8px; cursor: pointer; transition: 0.3s; font-size: 1rem; }
        .btn-submit:hover { opacity: 0.9; }
        table { width: 100%; border-collapse: collapse; text-align: left; margin-top: 15px; }
        th { padding: 14px; color: #94a3b8; font-size: 0.85rem; border-bottom: 1px solid rgba(255,255,255,0.1); }
        td { padding: 14px; border-bottom: 1px solid rgba(255,255,255,0.05); font-size: 0.9rem; }
        .action-btn { background: #38bdf8; color: #0b131f; border: none; padding: 6px 12px; border-radius: 6px; font-weight: 600; cursor: pointer; }
        .delete-btn { background: #ef4444; color: white; border: none; padding: 6px 12px; border-radius: 6px; font-weight: 600; cursor: pointer; margin-left: 5px; }
    </style>
</head>
<body>

    <div id="login-overlay">
        <div class="login-card">
            <h2>Admin Login</h2>
            <form id="login-form" onsubmit="handleLogin(event)">
                <div class="form-group" style="margin-bottom: 20px;">
                    <label>Password</label>
                    <input type="password" id="login-pass" placeholder="Enter admin password" required>
                </div>
                <button type="submit" class="btn-submit">Login</button>
            </form>
        </div>
    </div>

    <nav>
        <div class="logo-area">
            <div class="logo-box">RT</div>
            <div class="logo-text">
                <h1>RELIANCE TRANSIT</h1>
                <p>ADMIN CONTROL PANEL</p>
            </div>
        </div>
        <a href="index.html" style="color: #38bdf8; text-decoration: none; font-weight: 600; font-size: 0.9rem;">← View Live Site</a>
    </nav>

    <div class="main-container">
        <div class="card">
            <h3 id="form-title">Create New Shipment Waybill</h3>
            <form id="admin-form">
                <div class="form-grid">
                    <div class="form-group">
                        <label>Tracking Number</label>
                        <input type="text" id="track-no" required>
                    </div>
                    <div class="form-group">
                        <label>Receiver Email (For Auto-Updates)</label>
                        <input type="email" id="client-email" placeholder="client@example.com" required>
                    </div>
                    <div class="form-group">
                        <label>Sender Name</label>
                        <input type="text" id="sender" placeholder="e.g. John Doe" required>
                    </div>
                    <div class="form-group">
                        <label>Sender Country</label>
                        <input type="text" id="sender-country" placeholder="e.g. United States" required>
                    </div>
                    <div class="form-group">
                        <label>Receiver Name</label>
                        <input type="text" id="receiver" placeholder="e.g. Jane Smith" required>
                    </div>
                    <div class="form-group">
                        <label>Receiver Country</label>
                        <input type="text" id="receiver-country" placeholder="e.g. United Kingdom" required>
                    </div>
                    <div class="form-group" style="grid-column: span 2;">
                        <label>Receiver House Address</label>
                        <input type="text" id="house-address" placeholder="e.g. 123 Baker Street, Apt 4B" required>
                    </div>
                    <div class="form-group">
                        <label>Current Status</label>
                        <select id="status" required>
                            <option value="Order Created / Label Generated">Order Created / Label Generated</option>
                            <option value="Picked Up by Courier">Picked Up by Courier</option>
                            <option value="Departed Origin Facility">Departed Origin Facility</option>
                            <option value="Arrived at Transit Hub">Arrived at Transit Hub</option>
                            <option value="In Transit - Flight Departed">In Transit - Flight Departed</option>
                            <option value="Arrived at Destination Country">Arrived at Destination Country</option>
                            <option value="Customs Clearance in Progress">Customs Clearance in Progress</option>
                            <option value="Released from Customs">Released from Customs</option>
                            <option value="Out for Delivery">Out for Delivery</option>
                            <option value="Delivery Attempted - Recipient Unavailable">Delivery Attempted - Recipient Unavailable</option>
                            <option value="Delivered">Delivered</option>
                            <option value="Exception / Held at Facility">Exception / Held at Facility</option>
                            <option value="Return to Sender">Return to Sender</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Current Stage Number (1 to 5)</label>
                        <input type="number" id="stage" min="1" max="5" placeholder="e.g. 3" required>
                    </div>
                    <div class="form-group">
                        <label>Current City & Country</label>
                        <input type="text" id="current-city-country" placeholder="e.g. London, United Kingdom" required>
                    </div>
                    <div class="form-group">
                        <label>Current Airport / Sorting Facility</label>
                        <input type="text" id="current-facility" placeholder="e.g. Heathrow Airport (LHR) / Sorting Hub A" required>
                    </div>
                </div>
                <button type="submit" class="btn-submit" id="submit-btn-text">Save & Register Waybill</button>
            </form>
        </div>

        <div class="card">
            <h3>Active Shipments Database</h3>
            <div style="overflow-x: auto;">
                <table>
                    <thead>
                        <tr>
                            <th>Tracking #</th>
                            <th>Receiver & Email</th>
                            <th>Status</th>
                            <th>Current Location / Facility</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="admin-table-body"></tbody>
                </table>
            </div>
        </div>
    </div>
</body>
</html>
